name: Uji & deploy web

# Hanya dijalankan manual (tab Actions › Run workflow). Aplikasi utama dilayani oleh Apps Script;
# GitHub Pages opsional. Untuk otomatis lagi, tambahkan:  push: { branches: [main] }
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kasus uji PRD bagian 11
        run: node tests/run-tests.js
      - name: Engine.gs harus identik dengan web/engine.js
        run: |
          node scripts/sync-engine.js
          git diff --exit-code apps-script/Engine.gs || (echo "Jalankan: node scripts/sync-engine.js lalu commit" && exit 1)

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
